# SUMo — surcharge ENTREPÔT PostgreSQL (cahier §4, trajectoire de production).
# Active la persistance relationnelle de l'entrepôt (en plus du registre signé).
# Usage explicite (n'est PAS auto-fusionnée) :
#   docker compose -f docker-compose.yml -f docker-compose.db.yml up -d --build
#   = make up-db
services:
  app:
    environment:
      # Connexion à la base ; l'app crée la table `tdr` et y persiste chaque transaction.
      DATABASE_URL: postgres://sumo:${POSTGRES_PASSWORD:-sumo}@db:5432/sumo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sumo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumo}
      POSTGRES_DB: sumo
    volumes:
      - pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumo -d sumo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
